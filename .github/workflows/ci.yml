name: CI

# On every push: the bot plays every mode headless (fails on any script error),
# then a short half-size vertical clip is recorded to check the video pipeline.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.4.1-stable
      - name: Install Godot
        run: echo "GODOT=$(tools/install_godot.sh ~/godot)" >> "$GITHUB_ENV"
      - name: Collision test (headless physics, lamps and trees)
        run: tools/test_props.sh "$GODOT" smoke-out
      - name: Fire test (headless, burning cars)
        run: tools/test_fire.sh "$GODOT" smoke-out
      - name: Determinism test (the same seed gives the same run)
        run: |
          tools/test_determinism.sh "$GODOT" smoke-out chase
          tools/test_determinism.sh "$GODOT" smoke-out swarm
      - name: Swarm test (30-40 police from every side, the director steers through)
        run: tools/test_swarm.sh "$GODOT" smoke-out
      - name: Smoke test (headless, all bot modes)
        run: tools/smoke.sh "$GODOT" smoke-out 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: smoke-out/
          retention-days: 7

  preview:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [escape, chase, stunt, heli, rush, swarm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.4.1-stable
      - name: Install Godot and recording tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth ffmpeg fonts-dejavu-core libgl1-mesa-dri libglx-mesa0 \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libxkbcommon-x11-0
          echo "GODOT=$(tools/install_godot.sh ~/godot)" >> "$GITHUB_ENV"
      - name: Record a 30 s vertical preview (30 fps, 60% size)
        env:
          MODE: ${{ matrix.mode }}
          ORIENTATION: vertical
          DURATION: "30"
          FPS: "30"
          SEED: "7"
          SCALE: "0.6"
        run: tools/record.sh "$GODOT" preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-${{ matrix.mode }}
          path: preview/
          retention-days: 7

  story:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Story writer regression tests (offline)
        run: python3 -m unittest discover -s tools/tests -p 'test_story_writer.py' -v
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.4.1-stable
      - name: Install recording tools on the GitHub runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth ffmpeg fonts-dejavu-core libgl1-mesa-dri libglx-mesa0 libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libxkbcommon-x11-0
          pip install --quiet numpy
          echo "GODOT=$(tools/install_godot.sh ~/godot)" >> "$GITHUB_ENV"
      - name: On-foot chase runtime test (capture and escape)
        run: bash tools/run_test.sh "$GODOT" story story-checks --bot=chase --duration=180 --orientation=vertical --story=res://story/screenplays/ep7_foot_chase.json
      - name: Record the saved on-foot story demo
        env:
          MODE: chase
          ORIENTATION: vertical
          FPS: "30"
          SEED: "7"
          SCALE: "0.5"
          TIME: day
        run: |
          mkdir -p story-demo story-checks
          python3 tools/story/voices.py story/screenplays/ep7_foot_chase.json story-demo --provider none
          export DURATION=$(python3 -c "import json; print(json.load(open('story-demo/timed.json'))['duration_hint'])")
          export EXTRA_ARGS="--story=$PWD/story-demo/timed.json --story_log=$PWD/story-checks/story_log.json"
          tools/record.sh "$GODOT" story-checks
          python3 tools/story/verify.py story-demo/timed.json story-checks/story_log.json story-checks/godot.log
          python3 tools/story/mix.py story-checks/video.mp4 story-checks/story_log.json story-demo/timed.json story-checks/story-demo.mp4 --music action
      - name: Render and verify the three location sketches
        env:
          MODE: chase
          ORIENTATION: vertical
          FPS: "30"
          SEED: "7"
          SCALE: "0.35"
          TIME: dusk
        run: |
          for location in college_gate bus_stop park; do
            out="story-checks/$location"
            python3 tools/story/voices.py "story/screenplays/ep8_$location.json" "$out" --provider none
            export DURATION=$(python3 -c "import json; print(json.load(open('$out/timed.json'))['duration_hint'])")
            export EXTRA_ARGS="--story=$PWD/$out/timed.json --story_log=$PWD/$out/story_log.json"
            tools/record.sh "$GODOT" "$out"
            python3 tools/story/verify.py "$out/timed.json" "$out/story_log.json" "$out/godot.log"
            python3 -c "import json; e=[x['type'] for x in json.load(open('$out/story_log.json'))['events']]; assert 'location_$location' in e; assert 'reaction_shock_freeze' in e"
            python3 tools/story/mix.py "$out/video.mp4" "$out/story_log.json" "$out/timed.json" "$out/sketch.mp4" --music funny
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-chase-checks
          path: |
            story-checks/
            story-demo/timed.json
          retention-days: 7
