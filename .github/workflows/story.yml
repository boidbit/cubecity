name: Story video (experiment)

# Story lab: Babu and Shona drive through the city and act out an episode; when the story needs
# it they pull over and get out for a scene on the pavement, at a bench, an ice-cream cart or a
# chai stall. Gemini writes the episode from the story type and your idea and gives the
# characters their voices, the game stages it (police, the helicopter or a jump only appear when
# the story asks for them), and background music to suit the mood is made from scratch.
# Actions tab -> "Story video (experiment)" -> Run workflow. The run attaches the MP4, a
# thumbnail, the upload text and the screenplay (which you can save to story/screenplays).
#
# Needs repository secrets GEMINI_API_KEY (or GEMINI_API_KEY_1, _2, ... ; the next is used when one
# runs out) for the AI writer and the Gemini voices. Without them the saved episode and the
# free Edge voices are used.
# On every push to story-lab it makes a small, quick preview of the saved episode instead.
on:
  workflow_dispatch:
    inputs:
      story_type:
        description: "Mood of the episode"
        type: choice
        options: [funny, romantic, cringe, happy, sad, action, twist]
        default: funny
      idea:
        description: "Your idea in a few words (blank = AI decides). Example: Shona's birthday, Babu forgot the cake"
        type: string
        default: ""
      script:
        description: "ai = Gemini writes a new episode; otherwise a saved episode from story/screenplays"
        type: choice
        options: [ai, ep1_date_night, ep2_dangerous_question, ep3_proposal, ep4_icecream]
        default: ai
      language:
        type: choice
        options: [hinglish, hindi, english]
        default: hinglish
      voice:
        description: "auto = Gemini voices if there is a key, else the free Edge voices"
        type: choice
        options: [auto, gemini, edge, none]
        default: auto
      music:
        description: "Background music (made from scratch, free to use). auto = to suit the episode's mood"
        type: choice
        options: [auto, none, romantic, happy, funny, cringe, sad, action, twist]
        default: auto
      orientation:
        description: "vertical = Shorts / Reels (1080x1920), horizontal = normal video"
        type: choice
        options: [vertical, horizontal]
        default: vertical
      fps:
        type: choice
        options: ["60", "30"]
        default: "60"
      time:
        description: "Time of day (auto = what suits the story)"
        type: choice
        options: [auto, day, dusk, night]
        default: auto
      seed:
        description: "Random seed for the city and traffic (blank = random)"
        type: string
        default: ""
  push:
    branches: [story-lab]
    paths: ["story/**", "tools/story/**", ".github/workflows/story.yml", "director.gd", "stunts.gd"]

concurrency:
  group: story-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PREVIEW: ${{ github.event_name == 'push' }}
      # Gemini keys: when one runs out of quota the next one is used
      GEMINI_API_KEY: >-
        ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GEMINI_KEY || secrets.GEMINI
        || secrets.GEMINI_AI_KEY || secrets.GEMINI_API || secrets.GOOGLE_GEMINI_API_KEY || vars.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      STORY_TYPE: ${{ inputs.story_type || 'funny' }}
      IDEA: ${{ inputs.idea }}
      SCRIPT: ${{ inputs.script || 'ep4_icecream' }}
      MUSIC: ${{ inputs.music || 'auto' }}
      LANGUAGE: ${{ inputs.language || 'hinglish' }}
      VOICE: ${{ inputs.voice || 'edge' }}
      ORIENTATION: ${{ inputs.orientation || 'vertical' }}
      FPS_IN: ${{ inputs.fps || '30' }}
      TIME_IN: ${{ inputs.time || 'auto' }}
      SEED_IN: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.4.1-stable
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth ffmpeg espeak-ng fonts-dejavu-core \
            libgl1-mesa-dri libglx-mesa0 libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libxkbcommon-x11-0
          pip install --quiet edge-tts numpy
          echo "GODOT=$(tools/install_godot.sh ~/godot)" >> "$GITHUB_ENV"
          n=$(python3 -c "import sys; sys.path.insert(0, 'tools/story'); import gemini; print(len(gemini.keys()))")
          if [ "$n" -gt 0 ]; then echo "Gemini keys found: $n"; else echo "::warning::No GEMINI_API_KEY secret: using the saved episode and the free voices"; fi
      - name: Write the episode
        id: write
        run: |
          mkdir -p story-out
          if [ "$SCRIPT" = ai ]; then
            python3 tools/story/write.py --out story-out/screenplay.json --type "$STORY_TYPE" --idea "$IDEA" --language "$LANGUAGE"
          else
            cp "story/screenplays/$SCRIPT.json" story-out/screenplay.json
            python3 -c "import json; print('time=' + json.load(open('story-out/screenplay.json')).get('time', 'dusk'))" >> "$GITHUB_OUTPUT"
          fi
      # voice clips made before (same line, same voice) are reused: no quota spent on them
      - uses: actions/cache@v4
        with:
          path: story-cache
          key: story-voices-${{ github.run_id }}
          restore-keys: story-voices-
      - name: Voices
        id: voices
        run: python3 tools/story/voices.py story-out/screenplay.json story-out --provider "$VOICE" --cache story-cache
      - name: Record
        env:
          MODE: chase
          DURATION: ${{ steps.voices.outputs.duration_hint }}
          STORY_TIME: ${{ steps.write.outputs.time }}
        run: |
          export ORIENTATION FPS="$FPS_IN"
          export TIME="$TIME_IN"
          if [ "$TIME" = auto ]; then export TIME="${STORY_TIME:-dusk}"; fi
          export SEED="${SEED_IN//[^0-9]/}"
          [ -n "$SEED" ] || SEED=$(( RANDOM * 7 + RANDOM ))
          export SEED
          if [ "$PREVIEW" = true ]; then export SCALE=0.5 FPS=30; fi
          export EXTRA_ARGS="--story=$PWD/story-out/timed.json --story_log=$PWD/take/story_log.json"
          mkdir -p take
          tools/record.sh "$GODOT" take
      - name: Mix voices and write the upload text
        run: |
          mkdir -p video
          python3 tools/story/mix.py take/video.mp4 take/story_log.json story-out/timed.json video/story.mp4 --music "$MUSIC"
          python3 tools/story/text.py story-out/timed.json video/upload.txt
          t=$(python3 -c "import json; l=json.load(open('take/story_log.json'))['lines']; print(l[1]['t'] + 1.2 if len(l) > 1 else 6)")
          ffmpeg -y -loglevel error -ss "$t" -i video/story.mp4 -frames:v 1 -q:v 2 video/thumbnail.jpg
          cp story-out/screenplay.json video/screenplay.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          sp = json.load(open("story-out/timed.json", encoding="utf-8"))
          log = json.load(open("take/story_log.json"))
          print(f"### {sp.get('title')} / {sp.get('episode')}")
          print(f"written by: {sp.get('writer', 'saved episode')} | voices: {sp.get('provider')} | ending: {log.get('ending') or '-'}")
          print()
          for b in sp.get("beats", []):
              if "say" in b:
                  print(f"- **{b['say']}** ({b.get('emotion', 'neutral')}): {b['sub']}")
              else:
                  print(f"- _{json.dumps(b, ensure_ascii=False)}_")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: story-video-${{ github.run_number }}
          path: |
            video/
            story-out/
            take/story_log.json
            take/loudness.txt
            take/audio.png
            take/godot.log
          retention-days: 14
