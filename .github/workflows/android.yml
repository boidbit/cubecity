name: Build Android APK

# Where the APK ends up:
# - every push to main: the "Latest build" release (always the newest APK, replaced each time)
# - a release you publish on GitHub (Releases -> Draft a new release), or a pushed v* tag:
#   the APK is attached to that release
# - Actions -> Build Android APK -> Run workflow with a "release_tag" (e.g. v1.2): a new
#   release with that tag
# - every run (pull requests too): the run's artifact
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Make a release with this tag (e.g. v1.2). Blank = just build"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz 'templates/android*' 'templates/version.txt'
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates templates.tpz

      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE_BASE64 secret set. Using a fresh key, so this APK cannot update one built by another run."
            keytool -genkey -v -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Import project
        run: ~/godot/godot --headless --import || true

      - name: Export APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --export-debug "Android" build/cube_city_chase.apk
          test -s build/cube_city_chase.apk
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: cube-city-chase-apk
          path: build/cube_city_chase.apk
          retention-days: 30

      - name: Update the "Latest build" release (pushes to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short="${GITHUB_SHA::7}"
          notes="The newest APK, built automatically from main (commit $short).

          Install: open this page on your phone, download cube_city_chase.apk and open it
          (allow installing from this source when Android asks)."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/cube_city_chase.apk --target "$GITHUB_SHA" --prerelease \
            --title "Latest build ($(date -u +%Y-%m-%d), $short)" --notes "$notes"

      - name: Attach the APK to the release (published releases and v* tags)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: build/cube_city_chase.apk

      - name: Make a release (manual run with a release_tag)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::release_tag may only use letters, digits, '.', '_' and '-'"
            exit 1
          fi
          gh release create "$TAG" build/cube_city_chase.apk --target "$GITHUB_SHA" \
            --title "Cube City Chase $TAG" --generate-notes
